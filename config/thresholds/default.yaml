version: 1
tags:
  exclude: o11y-exclude
  threshold_prefix: o11y-threshold-
  owner: owner
  assignment_group: assignment_group
  car_id: car_id
windows:
  ops:
    lookback_minutes: 60
    granularity: PT1M
    aggregation: average
  finops:
    lookback_days: 14
    granularity: PT1H
    aggregation: average
    percentile: 95
    min_coverage: 0.5
# Per resource type: the Azure Monitor namespace, one block per metric key, and the recommender's
# knobs. Metric fields are documented in docs/agents/thresholds.md. A metric with `ops_hot` is
# evaluated on Ops runs, one with `finops_cold` on FinOps runs; a metric with neither is fetched
# for the recommender only. Tag overrides: o11y-threshold-<key>-hot / -cold.
resource_types:
  vm:
    namespace: Microsoft.Compute/virtualMachines
    metrics:
      cpu:
        metric_name: Percentage CPU
        unit: Percent
        ops_hot: 90
        finops_cold: 20
      memory:
        # Platform metric (no guest agent). Low is hot; FinOps takes the P5 (peak use = 100 - P5).
        metric_name: Available Memory Percentage
        unit: Percent
        hot_when: below
        ops_hot: 10
        finops_cold: 70
      # Disk metrics apply to premium-storage-capable sizes only; others skip with no_ops_data.
      os_disk_iops:
        metric_name: OS Disk IOPS Consumed Percentage
        ops_hot: 90
      os_disk_bandwidth:
        metric_name: OS Disk Bandwidth Consumed Percentage
        ops_hot: 90
      vm_uncached_iops:
        metric_name: VM Uncached IOPS Consumed Percentage
        ops_hot: 90
      vm_uncached_bandwidth:
        metric_name: VM Uncached Bandwidth Consumed Percentage
        ops_hot: 90
    recommend:
      min_vcpu: 1
  sqldb:
    namespace: Microsoft.Sql/servers/databases
    metrics:
      # One utilization metric per purchasing model; `applies_to` picks the one that exists.
      dtu:
        metric_name: dtu_consumption_percent
        applies_to: {purchasing_model: [dtu]}
        ops_hot: 90
        finops_cold: 20
      cpu:
        metric_name: cpu_percent
        applies_to: {purchasing_model: [vcore]}
        ops_hot: 90
        finops_cold: 20
      app_cpu:
        # Serverless bills on app CPU; auto-pause already handles idleness, so Ops only.
        metric_name: app_cpu_percent
        applies_to: {purchasing_model: [serverless]}
        ops_hot: 90
      storage:
        # Hyperscale storage grows on demand and reports no storage_percent.
        metric_name: storage_percent
        applies_to: {hyperscale: ["false"]}
        ops_hot: 90
      workers:
        metric_name: workers_percent
        ops_hot: 90
    recommend:
      min_vcores: 2
      headroom: 1.3
  sqlpool:
    namespace: Microsoft.Sql/servers/elasticPools
    metrics:
      dtu:
        metric_name: dtu_consumption_percent
        applies_to: {purchasing_model: [dtu]}
        ops_hot: 90
        finops_cold: 20
      cpu:
        metric_name: cpu_percent
        applies_to: {purchasing_model: [vcore]}
        ops_hot: 90
        finops_cold: 20
      storage:
        metric_name: storage_percent
        ops_hot: 90
    recommend:
      min_vcores: 2
      headroom: 1.3
  sqlmi:
    namespace: Microsoft.Sql/managedInstances
    metrics:
      cpu: {metric_name: avg_cpu_percent, ops_hot: 90, finops_cold: 20}
      storage:
        metric_name: storage_percent
        derive: ratio_percent
        inputs: [storage_space_used_mb, reserved_storage_mb]
        ops_hot: 90
    recommend: {min_vcores: 4, headroom: 1.3}
  postgres:
    namespace: Microsoft.DBforPostgreSQL/flexibleServers
    metrics:
      cpu:
        metric_name: cpu_percent
        ops_hot: 90
        finops_cold: 20
      memory:
        metric_name: memory_percent
        ops_hot: 90
        finops_cold: 30
      storage:
        metric_name: storage_percent
        ops_hot: 90
      disk_iops:
        metric_name: disk_iops_consumed_percentage
        ops_hot: 90
    recommend:
      min_vcpu: 2
  cosmos:
    namespace: Microsoft.DocumentDB/databaseAccounts
    # FinOps must be PT5M or coarser: ProvisionedThroughput/AutoscaleMaxThroughput reject PT1M.
    # The Ops override to PT5M is a choice, not a requirement (those two metrics are never
    # requested on an Ops run): it keeps both windows on the metrics' native grain. See
    # docs/gotchas.md.
    granularity: {ops: PT5M, finops: PT1H}
    metrics:
      ru:
        metric_name: NormalizedRUConsumption
        aggregation: Maximum
        ops_hot: 90
        finops_cold: 30
      throttled:
        metric_name: ThrottledRequestPercentage
        ops_hot: 5
      # No thresholds: fetched on FinOps runs so the recommender can size a target.
      provisioned:
        metric_name: ProvisionedThroughput
        unit: Count
        aggregation: Maximum
        applies_to: {capacity_mode: [provisioned]}
      autoscale_max:
        metric_name: AutoscaleMaxThroughput
        unit: Count
        aggregation: Maximum
        applies_to: {capacity_mode: [provisioned]}
    recommend:
      min_ru: 400
      headroom: 1.3
      autoscale_ratio: 3.0
  eventhub:
    namespace: Microsoft.EventHub/namespaces
    metrics:
      throttled:
        metric_name: ThrottledRequests
        unit: Count
        aggregation: Total
        reduce: sum
        ops_hot: 1
      # Premium only: dedicated CPU per PU: Basic/Standard are multi-tenant with no CPU metric.
      cpu:
        metric_name: NamespaceCpuUsage
        applies_to:
          tier: [Premium]
        ops_hot: 90
      ingress:
        metric_name: IncomingBytes
        unit: Percent
        aggregation: Total
        derive: bytes_per_second_percent
        inputs: [IncomingBytes]
        capacity_prop: capacity_bytes_per_second
        applies_to:
          tier: [Basic, Standard, Premium]
        finops_cold: 30
    recommend:
      headroom: 1.3
      # Ingress capacity per unit, decimal MB/s. Azure publishes 1 MB/s per TU (Basic/Standard)
      # and quotes 5-10 MB/s per PU (Premium); the conservative end is the default.
      mb_per_tu: 1
      mb_per_pu: 5
  vnet:
    namespace: Microsoft.Network/virtualNetworks
    metrics:
      subnet_ip: {metric_name: SubnetIpUtilization, inputs: [utilization_percent], ops_hot: 80}
  appgateway:
    namespace: Microsoft.Network/applicationGateways
    metrics:
      unhealthy_hosts:
        metric_name: UnhealthyHostCount
        unit: Count
        ops_hot: 1
      # ResponseStatus 5xx needs a dimension filter on HttpStatusGroup that would collide with an
      # unfiltered ResponseStatus in the same mode; FailedRequests is the 5xx proxy.
      failed_requests:
        metric_name: FailedRequestPercentage
        aggregation: Total
        derive: ratio_percent
        inputs: [FailedRequests, TotalRequests]
        ops_hot: 5
      # v1 only: v2 gateways report capacity units, not CPU.
      cpu:
        metric_name: CpuUtilization
        applies_to:
          v2: ["false"]
        ops_hot: 90
      # Consumed capacity units as a share of the reserved ones (instances × cu_per_instance).
      capacity:
        metric_name: CapacityUnitsPercentage
        unit: Percent
        derive: percent_of_capacity
        inputs: [CapacityUnits]
        capacity_prop: reserved_capacity_units
        applies_to:
          v2: ["true"]
        finops_cold: 30
    recommend:
      # Azure reserves 10 capacity units per v2 instance.
      cu_per_instance: 10
      min_instances: 1
      headroom: 1.3
